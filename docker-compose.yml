version: '3'
services:
  db:
    image: postgres:17.2
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - task-manager-network

  task-manager:
    build: .
    image: faisalagla/task-manager
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - task-manager-network

networks:
  task-manager-network:
    driver: "bridge"