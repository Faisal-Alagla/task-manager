services:
  task-db:
    image: postgres:17.2
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - task_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "/usr/bin/pg_isready -U postgres -d task-manager -h localhost || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  task-manager:
    build:
      context: ../..
      dockerfile: services/task-manager/Dockerfile
    image: faisalagla/task-manager
    env_file:
      - .env
    ports:
      - "${TASK_MANAGER_HOST_PORT:-8081}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      task-db:
        condition: service_healthy

volumes:
  task_db_data:
