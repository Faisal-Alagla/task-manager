                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_by
                  type: UUID
              - column:
                  name: name
                  type: VARCHAR
              - column:
                  name: assignee_id
                  type: UUID
              - column:
                  name: due_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: description
                  type: VARCHAR
              - column:
                  name: status_id
                  type: INT
              - column:
                  name: priority_id
                  type: INT
              - column:
                  defaultValue: 'TRUE'
                  name: is_active
                  type: BOOLEAN